name: Optimizer policy tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  policy-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The reference-agent tests authenticate original sources from their
          # pinned Git object, which a one-commit checkout does not contain.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m compileall -q optimizer_agent
